appId: ${APP_ID}
name: Auth reloads and restores a synchronized trashed code
tags: [auth, android, online, fixture, sync, lifecycle]
---
- tapOn: "^Trash$"
- extendedWaitUntil:
    visible: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"
    timeout: 30000
- longPressOn: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"
- runFlow:
    when:
      notVisible:
        id: auth_selection_restore
    commands:
      - tapOn: "Restore"
- runFlow:
    when:
      visible:
        id: auth_selection_restore
    commands:
      - tapOn:
          id: auth_selection_restore
- tapOn: "All"
- extendedWaitUntil:
    visible: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"
    timeout: 30000
- longPressOn: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"
- assertVisible: "(?s)^Unpin.*"
- tapOn: "CI lifecycle fixture. Safe to mutate and delete."
- assertVisible:
    id: auth_notes_sheet
- assertVisible: "Copy"
- tapOn: "Close"
- tapOn: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"
- assertVisible: ${FIXTURE_LIFECYCLE_TAG}
- tapOn: ${FIXTURE_LIFECYCLE_TAG}
- assertVisible: "(?s)^Slack.*${FIXTURE_LIFECYCLE_EDITED_ACCOUNT}.*"

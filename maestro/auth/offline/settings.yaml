appId: io.ente.auth.independent
name: Inspect offline Auth settings
tags: [auth, android, offline, settings]
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/enter-offline-mode.yaml
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Data"
- assertVisible: "Security"
- assertVisible: "General"
- assertVisible: "Support"
- assertVisible: "About"
- assertVisible: "Theme"
- assertVisible:
    id: "auth_settings_data"
- assertVisible:
    id: "auth_settings_security"
- assertVisible:
    id: "auth_settings_general"
- assertVisible:
    id: "auth_settings_support"
- assertVisible:
    id: "auth_settings_about"
- assertVisible:
    id: "auth_settings_theme"
- scrollUntilVisible:
    element: "^Version .+$"
    direction: DOWN
    visibilityPercentage: 60
- assertVisible: "^Version .+$"
- tapOn:
    id: "auth_settings_general"
- assertVisible: "General"
- assertVisible: "Language"
- assertVisible: "App icon"
- assertVisible: "Show large icons"
- pressKey: BACK
- tapOn: "Settings"
- tapOn:
    id: "auth_settings_about"
- assertVisible: "About"
- pressKey: BACK
- tapOn: "Settings"
- tapOn:
    id: "auth_settings_theme"
- assertVisible: "Theme"
- assertVisible: "System"
- assertVisible: "Light"
- assertVisible: "Dark"

appId: io.ente.auth.independent
name: Edit and persist an offline code
tags:
  - auth
  - android
  - offline
  - core
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/enter-offline-mode.yaml
- runFlow:
    file: ../subflows/add-offline-account.yaml
    env:
      ISSUER: "GitHub"
      SECRET: "JBSWY3DPEHPK3PXP"
      ACCOUNT: "security@github.test"
      NOTE: "Primary admin account. Keep recovery contacts current."
- runFlow:
    when:
      notVisible:
        id: "auth_code_item"
    commands:
      - longPressOn: "GitHub"
- runFlow:
    when:
      visible:
        id: "auth_code_item"
    commands:
      - longPressOn:
          id: "auth_code_item"
- runFlow:
    when:
      visible:
        id: "auth_selection_action_bar"
    commands:
      - assertVisible:
          id: "auth_selection_count"
- runFlow:
    when:
      visible: "Primary admin account. Keep recovery contacts current."
    commands:
      - tapOn: "Primary admin account. Keep recovery contacts current."
      - assertVisible:
          id: "auth_notes_sheet"
      - assertVisible: "Copy"
      - tapOn: "Close"
      - runFlow:
          when:
            notVisible:
              id: "auth_code_item"
          commands:
            - longPressOn: "GitHub"
      - runFlow:
          when:
            visible:
              id: "auth_code_item"
          commands:
            - longPressOn:
                id: "auth_code_item"
- assertVisible: "(?s)^Pin.*"
- assertVisible: "(?s)^Add tag.*"
- assertVisible: "(?s)^Trash.*"
- tapOn: "(?s)^Pin.*"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "auth_code_item"
    commands:
      - longPressOn: "GitHub"
- runFlow:
    when:
      visible:
        id: "auth_code_item"
    commands:
      - longPressOn:
          id: "auth_code_item"
- assertVisible: "(?s)^Unpin.*"
- tapOn: "(?s)^Unpin.*"
- assertVisible: ".*security@github.test.*"
- runFlow:
    when:
      notVisible:
        id: "auth_code_item"
    commands:
      - longPressOn: "GitHub"
- runFlow:
    when:
      visible:
        id: "auth_code_item"
    commands:
      - longPressOn:
          id: "auth_code_item"
- assertVisible: "(?s)^Edit\nEdit$"
- tapOn: "(?s)^Edit\nEdit$"
- extendedWaitUntil:
    visible:
      id: "auth_manual_code_page"
    timeout: 10000
- tapOn:
    id: "auth_manual_issuer"
    point: "50%,70%"
- tapOn:
    id: "auth_manual_issuer"
    point: "95%,50%"
- tapOn:
    id: "auth_manual_issuer"
    point: "50%,70%"
- inputText: "Microsoft"
- tapOn:
    id: "auth_manual_account"
    point: "50%,70%"
- tapOn:
    id: "auth_manual_account"
    point: "95%,50%"
- tapOn:
    id: "auth_manual_account"
    point: "50%,70%"
- inputText: "platform@contoso.test"
- tapOn:
    id: "auth_manual_notes"
    point: "50%,50%"
- tapOn:
    id: "auth_manual_notes"
    point: "95%,50%"
- tapOn:
    id: "auth_manual_notes"
    point: "50%,50%"
- inputText: "Production access. Review recovery ownership quarterly."
- assertVisible: "Production access. Review recovery ownership quarterly."
- scrollUntilVisible:
    element:
      id: "auth_manual_save"
    direction: DOWN
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "auth_manual_save"
- extendedWaitUntil:
    visible: "(?s)^Microsoft.*platform@contoso.test.*"
    timeout: 10000
- assertNotVisible: ".*security@github.test.*"
- longPressOn:
    id: "auth_code_item"
- tapOn: "Production access. Review recovery ownership quarterly."
- assertVisible:
    id: "auth_notes_sheet"
- assertVisible: "Copy"
- tapOn: "Close"
- launchApp
- extendedWaitUntil:
    visible: "(?s)^Microsoft.*platform@contoso.test.*"
    timeout: 10000
- assertNotVisible: ".*security@github.test.*"
- longPressOn:
    id: "auth_code_item"
- tapOn: "Production access. Review recovery ownership quarterly."
- assertVisible:
    id: "auth_notes_sheet"

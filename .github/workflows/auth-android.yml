name: Auth Android

on:
    schedule:
        - cron: "17 1 * * *"
    push:
        branches: [main]
        paths: &test_paths
            - ".github/workflows/auth-android.yml"
            - "maestro/auth/**"
            - "scripts/**"
            - "museum/**"
            - "tools/auth-fixture-generator/**"
    pull_request:
        paths: *test_paths
    workflow_dispatch:
        inputs:
            suite:
                description: Auth suites to run
                required: true
                default: all
                type: choice
                options:
                    - all
                    - offline
                    - online
                    - basics
                    - organization
                    - tags
                    - trash
                    - account-auth
                    - recovery-password
                    - data-sync
                    - entity-lifecycle

permissions:
    contents: read

concurrency:
    group: auth-android-${{ github.ref }}-${{ inputs.suite || 'automatic' }}
    cancel-in-progress: true

env:
    APP_ID: io.ente.auth.independent
    AUTH_APK_PATH: ${{ github.workspace }}/artifacts/auth.apk
    MAESTRO_CLI_NO_ANALYTICS: 1
    # Cover installer version checks as well as test runs.
    MAESTRO_API_URL: http://127.0.0.1:9
    # Use Mesa's host OpenGL implementation, not the crashing bundled renderers.
    LIBGL_ALWAYS_SOFTWARE: 1

jobs:
    prepare:
        name: Prepare Auth tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            should_run: ${{ steps.freshness.outputs.should_run }}
            build: ${{ steps.apk.outputs.build }}
            groups: ${{ steps.apk.outputs.groups }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Test TOTP generation
              run: python3 -m unittest discover -s scripts/auth

            - name: Resolve published Auth build
              id: apk
              env:
                  GH_TOKEN: ${{ github.token }}
                  SUITE: ${{ inputs.suite || 'all' }}
              run: |
                  build=$(scripts/apk.sh resolve auth)
                  echo "$build"
                  echo "build=$build" >> "$GITHUB_OUTPUT"
                  case "$SUITE" in
                      all) groups='["offline","online"]' ;;
                      offline|basics|organization|tags|trash) groups='["offline"]' ;;
                      online|account-auth|recovery-password|data-sync|entity-lifecycle) groups='["online"]' ;;
                      *) exit 1 ;;
                  esac
                  echo "groups=$groups" >> "$GITHUB_OUTPUT"

            - name: Check scheduled build freshness
              id: freshness
              if: steps.apk.outcome == 'success'
              env:
                  BUILD: ${{ steps.apk.outputs.build }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  should_run=true
                  if [[ "$EVENT_NAME" == schedule ]]; then
                      APK_CREATED_AT=$(jq -er '.apk_created_at' <<< "$BUILD")
                      created_epoch=$(date -u -d "$APK_CREATED_AT" +%s)
                      age_seconds=$(( $(date -u +%s) - created_epoch ))
                      if (( age_seconds < 0 || age_seconds > 86400 )); then
                          should_run=false
                      fi
                  fi
                  echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

    test:
        name: Auth ${{ matrix.group }}
        needs: prepare
        if: needs.prepare.outputs.should_run == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                group: ${{ fromJSON(needs.prepare.outputs.groups) }}
        env:
            AUTH_APP_PREPARATION: root-prefs
            AUTH_FIXTURE_COMPOSE_PROJECT: auth-online-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Download resolved Auth build
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUILD: ${{ needs.prepare.outputs.build }}
              run: scripts/apk.sh download "$BUILD" "$AUTH_APK_PATH"

            - name: Install pinned Maestro
              run: scripts/install-maestro.sh

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm --settle
                  test -r /dev/kvm && test -w /dev/kvm

            - name: Start virtual display for Mesa
              timeout-minutes: 1
              run: |
                  read -r display < <(Xvfb -displayfd 1 -screen 0 1280x1024x24 -nolisten tcp 2> /tmp/auth-xvfb.log)
                  echo "DISPLAY=:$display" >> "$GITHUB_ENV"

            - name: Run Auth tests
              id: tests
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_GROUP: ${{ matrix.group }}
                  AUTH_TEST_SUITE: ${{ inputs.suite || 'all' }}
                  MAESTRO_ARTIFACTS_DIR: artifacts/maestro/${{ matrix.group }}
              with:
                  api-level: 34
                  emulator-build: 15917651
                  target: default
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: -no-window -gpu host -feature -Vulkan -accel on -no-metrics -no-snapshot -noaudio -no-boot-anim -memory 4096
                  disable-animations: true
                  script: case "$AUTH_TEST_SUITE" in all|offline|online) scripts/auth/$AUTH_TEST_GROUP.sh ;; *) scripts/auth/$AUTH_TEST_GROUP.sh "$AUTH_TEST_SUITE" ;; esac
            - name: Upload results
              if: always() && steps.tests.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-${{ matrix.group }}-results
                  path: artifacts/maestro/**/results/**/*.xml
                  if-no-files-found: error
                  retention-days: 7

            - name: Capture host runtime health
              if: failure()
              run: |
                  mkdir -p artifacts/runtime-health
                  {
                      date -u '+%Y-%m-%dT%H:%M:%SZ'
                      uname -a
                      free -h
                      df -h
                  } > artifacts/runtime-health/host.txt
                  sudo dmesg --ctime > artifacts/runtime-health/kernel.txt
                  sudo journalctl -b --no-pager -u systemd-oomd > artifacts/runtime-health/oomd.txt

            # Explicit paths keep generated signup credentials out of uploaded traces.
            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-${{ matrix.group }}-diagnostics
                  path: |
                      artifacts/runtime-health
                      artifacts/maestro/offline
                      artifacts/maestro/online/*/runtime-health
                      artifacts/maestro/online/*/debug/account-auth/totp-start
                      artifacts/maestro/online/*/debug/account-auth/totp-complete
                      artifacts/maestro/online/*/debug/recovery-password
                      artifacts/maestro/online/*/debug/data-sync
                      artifacts/maestro/online/*/debug/entity-lifecycle
                  retention-days: 3

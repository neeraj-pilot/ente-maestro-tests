name: Auth Android

on:
    schedule:
        - cron: "17 1 * * *"
    push:
        branches: [main]
        paths: &test_paths
            - ".github/workflows/auth-android.yml"
            - "maestro/auth/**"
            - "maestro/fixtures/**"
            - "scripts/**"
            - "museum/**"
            - "tools/auth-fixture-generator/**"
    pull_request:
        paths: *test_paths
    workflow_dispatch:
        inputs:
            suite:
                description: Auth suites to run
                required: true
                default: all
                type: choice
                options:
                    - all
                    - offline
                    - online
                    - basics
                    - organization
                    - tags
                    - trash
                    - account-auth
                    - recovery-password
                    - data-sync
                    - entity-lifecycle
                    - startup

permissions:
    contents: read

concurrency:
    group: auth-android-${{ github.ref }}-${{ inputs.suite || 'automatic' }}
    cancel-in-progress: true

env:
    APP_ID: io.ente.auth.independent
    AUTH_APK_PATH: ${{ github.workspace }}/artifacts/auth.apk
    MAESTRO_CLI_NO_ANALYTICS: 1
    # Analytics opt-out does not cover error reports (Maestro issue #3488).
    MAESTRO_API_URL: http://127.0.0.1:9
    # Use Mesa's host OpenGL implementation, not the crashing bundled renderers.
    LIBGL_ALWAYS_SOFTWARE: 1

jobs:
    prepare:
        name: Prepare Auth tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            offline: ${{ steps.select.outputs.offline }}
            online: ${{ steps.select.outputs.online }}
            has_offline: ${{ steps.select.outputs.has_offline }}
            has_online: ${{ steps.select.outputs.has_online }}
            should_run: ${{ steps.freshness.outputs.should_run }}
            build: ${{ steps.apk.outputs.build }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate hosted test configuration
              run: |
                  python3 -m unittest discover -s scripts/tests
                  scripts/tests/apk.sh
                  scripts/tests/runners.sh

            - name: Select suites
              id: select
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  REQUESTED_SUITE: ${{ inputs.suite || 'all' }}
              run: python3 scripts/suites.py --suite "$REQUESTED_SUITE" --github-output "$GITHUB_OUTPUT"

            - name: Resolve published Auth build
              id: apk
              if: steps.select.outputs.has_offline == 'true' || steps.select.outputs.has_online == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  build=$(scripts/apk.sh resolve)
                  echo "build=$build" >> "$GITHUB_OUTPUT"

            - name: Check scheduled build freshness
              id: freshness
              if: steps.apk.outcome == 'success'
              env:
                  APK_CREATED_AT: ${{ fromJSON(steps.apk.outputs.build).apk_created_at }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  should_run=true
                  if [[ "$EVENT_NAME" == schedule ]]; then
                      created_epoch=$(date -u -d "$APK_CREATED_AT" +%s)
                      age_seconds=$(( $(date -u +%s) - created_epoch ))
                      if (( age_seconds < 0 || age_seconds > 86400 )); then
                          should_run=false
                      fi
                  fi
                  echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

            - name: Summarize build and selection
              env:
                  OFFLINE: ${{ steps.select.outputs.offline }}
                  ONLINE: ${{ steps.select.outputs.online }}
                  SHOULD_RUN: ${{ steps.freshness.outputs.should_run }}
                  BUILD: ${{ steps.apk.outputs.build }}
              run: |
                  {
                      echo "### Auth Android test plan"
                      echo
                      if [[ -z "$BUILD" ]]; then
                          echo "No hosted suites selected for these changes."
                      else
                          jq -r '"- Build: `\(.apk_name)`\n- Asset created: `\(.apk_created_at)`\n- Source: `\(.source_repository)`, release `\(.release_tag)` (\(.channel))\n- Asset ID: `\(.apk_asset_id)`\n- SHA-256: `\(.apk_sha256)`"' <<< "$BUILD"
                          echo "- Offline: $(jq -r '.include | map(.suite) | join(", ")' <<< "$OFFLINE")"
                          echo "- Online: $(jq -r 'join(", ")' <<< "$ONLINE")"
                          if [[ "$SHOULD_RUN" != true ]]; then
                              echo
                              echo "**Skipped:** no compatible Auth APK was published in the previous 24 hours. This is not a passing test run."
                          fi
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

    offline:
        name: Offline
        needs: prepare
        if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.has_offline == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - &checkout
              name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - &java
              name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - &download_apk
              name: Download resolved Auth build
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUILD: ${{ needs.prepare.outputs.build }}
              run: scripts/apk.sh download "$BUILD" "$AUTH_APK_PATH"

            - &maestro
              name: Install pinned Maestro
              run: scripts/install-maestro.sh

            - &kvm
              name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm --settle
                  test -r /dev/kvm && test -w /dev/kvm

            - &display
              name: Start virtual display for Mesa
              timeout-minutes: 1
              run: |
                  read -r display < <(Xvfb -displayfd 1 -screen 0 1280x1024x24 -nolisten tcp 2> /tmp/auth-xvfb.log)
                  echo "DISPLAY=:$display" >> "$GITHUB_ENV"

            - name: Run offline tests
              id: tests
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_SUITES: ${{ join(fromJSON(needs.prepare.outputs.offline).include.*.suite, ' ') }}
                  MAESTRO_ARTIFACTS_DIR: artifacts/maestro/offline
              with:
                  api-level: 34
                  emulator-build: 15917651
                  target: default
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: &emulator_options -no-window -gpu host -feature -Vulkan -accel on -no-metrics -no-snapshot -noaudio -no-boot-anim -memory 4096
                  disable-animations: true
                  script: scripts/run-auth-android-local.sh --apk "$AUTH_APK_PATH" --app-id "$APP_ID" --suite "$AUTH_TEST_SUITES"

            - name: Upload offline results
              if: always() && steps.tests.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-offline-results
                  path: artifacts/maestro/offline/**/results.xml
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload offline diagnostics
              if: failure() && steps.tests.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-offline-diagnostics
                  path: artifacts/maestro/offline
                  retention-days: 7

    online:
        name: Online
        needs: prepare
        if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.has_online == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            ONLINE_SUITES: ${{ needs.prepare.outputs.online }}
            ONLINE_ENDPOINT: http://10.0.2.2:8080
            ONLINE_OTT: 123456
            AUTH_FIXTURE_COMPOSE_PROJECT: auth-online-${{ github.run_id }}-${{ github.run_attempt }}
            MISSING_EMAIL: missing-${{ github.run_id }}-${{ github.run_attempt }}@example.org
            ONLINE_CODE_ACCOUNT: first-key-${{ github.run_id }}-${{ github.run_attempt }}@example.org
            ONLINE_EMAIL: auth-ci-${{ github.run_id }}-${{ github.run_attempt }}@example.org
        steps:
            - *checkout
            - *java
            - *download_apk
            - *maestro
            - *kvm
            - *display

            - name: Prepare online test environment
              id: ready
              run: |
                  if jq -e 'index("account-auth")' <<< "$ONLINE_SUITES" > /dev/null; then
                      password="AuthCi-$(openssl rand -hex 10)!"
                      echo "::add-mask::$password"
                      echo "ONLINE_PASSWORD=$password" >> "$GITHUB_ENV"
                  fi

            - name: Restore account-auth fixture
              id: account_backend
              if: ${{ !cancelled() && steps.ready.outcome == 'success' && contains(fromJSON(env.ONLINE_SUITES), 'account-auth') }}
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Run account-auth session
              id: account_auth
              if: ${{ !cancelled() && steps.account_backend.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: account-auth
              with: &online_emulator
                  api-level: 34
                  emulator-build: 15917651
                  target: default
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: *emulator_options
                  disable-animations: true
                  script: scripts/run-auth-online.sh "$AUTH_TEST_PHASE"

            - name: Restore recovery fixture
              id: recovery_backend
              if: ${{ !cancelled() && steps.ready.outcome == 'success' && contains(fromJSON(env.ONLINE_SUITES), 'recovery-password') }}
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Run recovery reset session
              id: recovery_reset
              if: ${{ !cancelled() && steps.recovery_backend.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: recovery-reset
              with: *online_emulator

            - name: Run recovery verification session
              id: recovery_verification
              if: ${{ !cancelled() && steps.recovery_reset.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: recovery-verification
              with: *online_emulator

            - name: Restore data-sync fixture
              id: sync_backend
              if: ${{ !cancelled() && steps.ready.outcome == 'success' && contains(fromJSON(env.ONLINE_SUITES), 'data-sync') }}
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Run data-sync session
              id: data_sync
              if: ${{ !cancelled() && steps.sync_backend.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: data-sync
              with: *online_emulator

            - name: Restore entity-lifecycle fixture
              id: lifecycle_backend
              if: ${{ !cancelled() && steps.ready.outcome == 'success' && contains(fromJSON(env.ONLINE_SUITES), 'entity-lifecycle') }}
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Run lifecycle create session
              id: lifecycle_create
              if: ${{ !cancelled() && steps.lifecycle_backend.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: entity-lifecycle-create
              with: *online_emulator

            - name: Run lifecycle mutation session
              id: lifecycle_mutate
              if: ${{ !cancelled() && steps.lifecycle_create.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: entity-lifecycle-mutate
              with: *online_emulator

            - name: Run lifecycle restore and delete session
              id: lifecycle_finish
              if: ${{ !cancelled() && steps.lifecycle_mutate.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: entity-lifecycle-finish
              with: *online_emulator

            - name: Restore startup fixture
              id: startup_backend
              if: ${{ !cancelled() && steps.ready.outcome == 'success' && contains(fromJSON(env.ONLINE_SUITES), 'startup') }}
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Run startup session
              id: startup
              if: ${{ !cancelled() && steps.startup_backend.outcome == 'success' }}
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              env:
                  AUTH_TEST_PHASE: startup
              with: *online_emulator

            # Startup stops at the empty email screen; no credentials are entered.
            - name: Upload startup diagnostics
              if: always() && steps.startup.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-startup-diagnostics
                  path: artifacts/maestro/online-debug/startup
                  retention-days: 3

            # Never upload the private signup/login traces from account-auth.
            - name: Upload public-fixture failure diagnostics
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-public-diagnostics
                  path: |
                      artifacts/maestro/online-debug/account-auth/prepared-totp-start
                      artifacts/maestro/online-debug/account-auth/prepared-totp-complete
                      artifacts/maestro/online-debug/recovery-*
                      artifacts/maestro/online-debug/data-sync
                      artifacts/maestro/online-debug/entity-lifecycle-*
                  retention-days: 3

            - name: Upload online results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-results
                  path: artifacts/maestro/online-results/**/*.xml
                  if-no-files-found: error
                  retention-days: 7

            - name: Capture host runtime health
              if: failure()
              run: |
                  mkdir -p artifacts/maestro/runtime-health
                  {
                      date -u '+%Y-%m-%dT%H:%M:%SZ'
                      uname -a
                      lscpu
                      free -h
                      df -h || true
                  } > artifacts/maestro/runtime-health/host.txt
                  sudo dmesg --ctime > artifacts/maestro/runtime-health/kernel.txt
                  sudo journalctl -b --no-pager -u systemd-oomd > artifacts/maestro/runtime-health/oomd.txt

            - name: Upload runtime health
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-runtime-health
                  path: artifacts/maestro/runtime-health
                  if-no-files-found: error
                  retention-days: 3

            - name: Stop Auth backend
              if: always()
              run: docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" --file museum/compose.yaml down --volumes --remove-orphans

            - name: Summarize online suites
              if: always()
              env:
                  RESULT: ${{ job.status }}
                  ACCOUNT_AUTH: ${{ steps.account_auth.outcome }}
                  RECOVERY_RESET: ${{ steps.recovery_reset.outcome }}
                  RECOVERY_VERIFICATION: ${{ steps.recovery_verification.outcome }}
                  DATA_SYNC: ${{ steps.data_sync.outcome }}
                  LIFECYCLE_CREATE: ${{ steps.lifecycle_create.outcome }}
                  LIFECYCLE_MUTATE: ${{ steps.lifecycle_mutate.outcome }}
                  LIFECYCLE_FINISH: ${{ steps.lifecycle_finish.outcome }}
                  STARTUP: ${{ steps.startup.outcome }}
              run: |
                  {
                      echo "### Online: $RESULT"
                      echo
                      echo "Android API 34, emulator build 15917651 (Mesa), Maestro $MAESTRO_VERSION."
                      echo
                      echo "| Suite / phase | Result |"
                      echo "| --- | --- |"
                      echo "| Account auth | $ACCOUNT_AUTH |"
                      echo "| Recovery: reset | $RECOVERY_RESET |"
                      echo "| Recovery: verification | $RECOVERY_VERIFICATION |"
                      echo "| Data sync | $DATA_SYNC |"
                      echo "| Lifecycle: create | $LIFECYCLE_CREATE |"
                      echo "| Lifecycle: mutate | $LIFECYCLE_MUTATE |"
                      echo "| Lifecycle: restore/delete | $LIFECYCLE_FINISH |"
                      echo "| Startup diagnostic | $STARTUP |"
                      echo
                      echo "Skipped phases were not selected or had an unsuccessful prerequisite. See fixture-restore steps for setup failures."
                      echo "Executed tests are in the JUnit artifact, grouped by phase."
                  } >> "$GITHUB_STEP_SUMMARY"

    result:
        name: Auth test result
        permissions: {}
        if: always()
        needs: [prepare, offline, online]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Verify selected suites
              env:
                  PREPARE_RESULT: ${{ needs.prepare.result }}
                  SHOULD_RUN: ${{ needs.prepare.outputs.should_run }}
                  HAS_OFFLINE: ${{ needs.prepare.outputs.has_offline }}
                  HAS_ONLINE: ${{ needs.prepare.outputs.has_online }}
                  OFFLINE_RESULT: ${{ needs.offline.result }}
                  ONLINE_RESULT: ${{ needs.online.result }}
              run: |
                  {
                      echo "### Auth test result"
                      echo
                      echo "| Group | Result |"
                      echo "| --- | --- |"
                      echo "| Preparation | $PREPARE_RESULT |"
                      echo "| Offline | $OFFLINE_RESULT |"
                      echo "| Online | $ONLINE_RESULT |"
                  } >> "$GITHUB_STEP_SUMMARY"
                  test "$PREPARE_RESULT" = success
                  if [[ "$SHOULD_RUN" != true ]]; then
                      echo "No device tests ran. See preparation for the selection or build-age skip reason." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  if [[ "$HAS_OFFLINE" == true ]]; then test "$OFFLINE_RESULT" = success; fi
                  if [[ "$HAS_ONLINE" == true ]]; then test "$ONLINE_RESULT" = success; fi

name: "Auth Android smoke"

on:
    schedule:
        - cron: "17 1 * * *"
    push:
        branches: [main]
        paths:
            - ".github/workflows/auth-android-smoke.yml"
            - "maestro/auth/**"
            - "maestro/fixtures/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/download-auth-apk.sh"
            - "scripts/install-maestro.sh"
            - "scripts/test-ci-helpers.sh"
            - "scripts/select-auth-ci-suites.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-ci-suites.sh"
    pull_request:
        paths:
            - ".github/workflows/auth-android-smoke.yml"
            - "maestro/auth/**"
            - "maestro/fixtures/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/download-auth-apk.sh"
            - "scripts/install-maestro.sh"
            - "scripts/test-ci-helpers.sh"
            - "scripts/select-auth-ci-suites.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-ci-suites.sh"
    workflow_dispatch:
        inputs:
            suite:
                description: Offline suite to run
                required: true
                default: all
                type: choice
                options:
                    - all
                    - setup
                    - organization
                    - settings
                    - tags
                    - trash

permissions:
    contents: read

concurrency:
    group: auth-android-smoke-${{ github.ref }}
    cancel-in-progress: true

env:
    MAESTRO_CLI_NO_ANALYTICS: 1
    # Analytics opt-out does not cover error reports (Maestro issue #3488).
    MAESTRO_API_URL: http://127.0.0.1:9

jobs:
    select:
        name: Select hosted Auth suites
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.select.outputs.matrix }}
            has_suites: ${{ steps.select.outputs.has_suites }}
            should_run: ${{ steps.freshness.outputs.should_run }}
            channel: ${{ steps.release.outputs.channel }}
            release_tag: ${{ steps.release.outputs.release_tag }}
            apk_asset_id: ${{ steps.release.outputs.apk_asset_id }}
            apk_name: ${{ steps.release.outputs.apk_name }}
            apk_created_at: ${{ steps.release.outputs.apk_created_at }}
            apk_sha256: ${{ steps.release.outputs.apk_sha256 }}
            source_repository: ${{ steps.release.outputs.source_repository }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate hosted test configuration
              run: |
                  scripts/test-select-auth-ci-suites.sh
                  scripts/test-hosted-flow-registration.sh

            - name: Validate nightly resolution
              run: |
                  scripts/test-resolve-nightly-apk.sh
                  scripts/test-ci-helpers.sh

            - name: Select suites for this event
              id: select
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  REQUESTED_SUITE: ${{ inputs.suite || 'all' }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" != "all" ]]; then
                      matrix="$(scripts/select-auth-ci-suites.sh --suite "$REQUESTED_SUITE")"
                  elif [[ "$EVENT_NAME" != "pull_request" ]]; then
                      matrix="$(scripts/select-auth-ci-suites.sh --all)"
                  else
                      matrix="$(scripts/select-auth-ci-suites.sh "$BASE_SHA" "$HEAD_SHA")"
                  fi
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  if [[ "$(jq '.include | length' <<< "$matrix")" -gt 0 ]]; then
                      echo "has_suites=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_suites=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Resolve published Auth build
              id: release
              if: steps.select.outputs.has_suites == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  scripts/resolve-nightly-apk.sh --github-output "$GITHUB_OUTPUT"

            - name: Check scheduled build freshness
              id: freshness
              if: steps.select.outputs.has_suites == 'true'
              env:
                  APK_CREATED_AT: ${{ steps.release.outputs.apk_created_at }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  should_run=true
                  if [[ "$EVENT_NAME" == "schedule" ]]; then
                      created_epoch=$(date -u -d "$APK_CREATED_AT" +%s)
                      now_epoch=$(date -u +%s)
                      age_seconds=$((now_epoch - created_epoch))
                      if (( age_seconds < 0 || age_seconds > 86400 )); then
                          should_run=false
                          echo "The latest Auth APK is $age_seconds seconds old; skipping this scheduled run."
                      fi
                  fi
                  echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

            - name: Summarize scheduled skip
              if: steps.freshness.outputs.should_run == 'false'
              run: |
                  {
                      echo "### Auth Android smoke skipped"
                      echo
                      echo "No compatible Auth APK was published in the previous 24 hours."
                  } >> "$GITHUB_STEP_SUMMARY"

    smoke:
        needs: select
        if: needs.select.outputs.has_suites == 'true' && needs.select.outputs.should_run == 'true'
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
        env:
            AUTH_APK_ASSET_ID: ${{ needs.select.outputs.apk_asset_id }}
            AUTH_APK_CREATED_AT: ${{ needs.select.outputs.apk_created_at }}
            AUTH_RELEASE_TAG: ${{ needs.select.outputs.release_tag }}
            AUTH_APK_NAME: ${{ needs.select.outputs.apk_name }}
            AUTH_APK_SHA256: ${{ needs.select.outputs.apk_sha256 }}
            AUTH_CHANNEL: ${{ needs.select.outputs.channel }}
            AUTH_SOURCE_REPOSITORY: ${{ needs.select.outputs.source_repository }}
            AUTH_APK_PATH: ${{ github.workspace }}/artifacts/auth/${{ needs.select.outputs.apk_name }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Download resolved Auth build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/download-auth-apk.sh "$AUTH_SOURCE_REPOSITORY" "$AUTH_APK_ASSET_ID" "$AUTH_APK_SHA256" "$AUTH_APK_PATH"

            - name: Install pinned Maestro
              run: scripts/install-maestro.sh

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run smoke tests
              id: smoke-tests
              continue-on-error: true
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 34
                  target: default
                  arch: x86_64
                  profile: pixel_5
                  emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
                  disable-animations: true
                  script: |
                      mkdir -p artifacts/maestro/debug
                      adb shell settings put system screen_off_timeout 2147483647
                      adb install -r "$AUTH_APK_PATH"
                      maestro test --no-ansi -e APP_ID=io.ente.auth.independent --format JUNIT --output artifacts/maestro/results.xml --debug-output artifacts/maestro/debug --flatten-debug-output ${{ matrix.flows }}

            - name: Summarize smoke tests
              if: always() && steps.smoke-tests.outcome != 'skipped'
              env:
                  TEST_OUTCOME: ${{ steps.smoke-tests.outcome }}
              run: |
                  if [[ "$TEST_OUTCOME" == "success" ]]; then
                      status="passed"
                  else
                      status="failed"
                  fi
                  {
                      echo "### Auth Android smoke $status"
                      echo
                      echo "- Release: \`$AUTH_RELEASE_TAG\`"
                      echo "- Channel: \`$AUTH_CHANNEL\`"
                      echo "- Build: \`$AUTH_APK_NAME\`"
                      echo "- Asset created: \`$AUTH_APK_CREATED_AT\`"
                      echo "- Asset ID: \`$AUTH_APK_ASSET_ID\`"
                      echo "- Auth APK SHA-256: \`$AUTH_APK_SHA256\`"
                      echo "- Suite: ${{ matrix.name }}"
                      echo "- Coverage: ${{ matrix.coverage }}"
                      echo "- Android API: \`34\`"
                      echo "- Maestro: \`$MAESTRO_VERSION\`"
                      if [[ "$TEST_OUTCOME" != "success" ]]; then
                          echo "- Diagnostics: see the \`auth-${{ matrix.suite }}-diagnostics\` artifact"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Maestro results
              if: always() && steps.smoke-tests.outcome != 'skipped'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-${{ matrix.suite }}-results
                  path: artifacts/maestro/results.xml
                  if-no-files-found: warn
                  retention-days: 7

            - name: Upload Maestro diagnostics
              if: steps.smoke-tests.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-${{ matrix.suite }}-diagnostics
                  path: artifacts/maestro
                  if-no-files-found: warn
                  retention-days: 7

            - name: Propagate smoke test failure
              if: steps.smoke-tests.outcome == 'failure'
              run: exit 1

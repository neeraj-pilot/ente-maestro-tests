name: "Auth Android online"

on:
    workflow_dispatch:
        inputs:
            lane:
                description: Online suite to run
                required: true
                default: all
                type: choice
                options:
                    - all
                    - account-auth
                    - recovery-password
                    - data-sync
                    - entity-lifecycle
    pull_request:
        paths:
            - ".github/scripts/run-auth-online-tests.sh"
            - ".github/workflows/auth-android-online.yml"
            - "maestro/auth/online/**"
            - "museum/**"
            - "scripts/current-totp.mjs"
            - "scripts/fixtures/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/select-auth-online-lanes.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-online-lanes.sh"
    push:
        branches: [main]
        paths:
            - ".github/scripts/run-auth-online-tests.sh"
            - ".github/workflows/auth-android-online.yml"
            - "maestro/auth/online/**"
            - "museum/**"
            - "scripts/current-totp.mjs"
            - "scripts/fixtures/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/select-auth-online-lanes.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-online-lanes.sh"

permissions:
    contents: read

concurrency:
    group: auth-android-online-${{ github.ref }}-${{ inputs.lane || 'automatic' }}
    cancel-in-progress: true

env:
    APP_ID: io.ente.auth.independent
    AUTH_APK_DIR: ${{ github.workspace }}/artifacts/auth
    MAESTRO_CLI_NO_ANALYTICS: 1
    MAESTRO_VERSION: 2.6.1
    MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
    AUTH_ANDROID_API: 34
    AUTH_ANDROID_TARGET: default
    AUTH_EMULATOR_BUILD: 12414864
    AUTH_EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -memory 6144
    ONLINE_ENDPOINT: http://10.0.2.2:8080
    ONLINE_OTT: 123456

jobs:
    resolve:
        name: Resolve test inputs
        runs-on: ubuntu-latest
        outputs:
            apk_asset_id: ${{ steps.nightly.outputs.apk_asset_id }}
            apk_created_at: ${{ steps.nightly.outputs.apk_created_at }}
            apk_name: ${{ steps.nightly.outputs.apk_name }}
            apk_sha256: ${{ steps.nightly.outputs.apk_sha256 }}
            channel: ${{ steps.nightly.outputs.channel }}
            lanes: ${{ steps.lanes.outputs.lanes }}
            release_tag: ${{ steps.nightly.outputs.release_tag }}
            source_repository: ${{ steps.nightly.outputs.source_repository }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Resolve online lanes
              id: lanes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
                  EVENT_NAME: ${{ github.event_name }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  REQUESTED_LANE: ${{ inputs.lane || 'all' }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      case "$REQUESTED_LANE" in
                          all) lanes=$(scripts/select-auth-online-lanes.sh --all) ;;
                          account-auth|recovery-password|data-sync|entity-lifecycle) lanes="[\"$REQUESTED_LANE\"]" ;;
                          *) echo "Unknown lane: $REQUESTED_LANE" >&2; exit 2 ;;
                      esac
                  elif [[ "$EVENT_NAME" == "pull_request" ]]; then
                      lanes=$(scripts/select-auth-online-lanes.sh "$BASE_SHA" "$HEAD_SHA")
                  else
                      lanes=$(scripts/select-auth-online-lanes.sh --all)
                  fi
                  if [[ "$(jq length <<< "$lanes")" -eq 0 ]]; then
                      echo "The online workflow ran without selecting an online lane" >&2
                      exit 1
                  fi
                  echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

            - name: Validate hosted test configuration
              run: |
                  scripts/test-select-auth-online-lanes.sh
                  scripts/test-hosted-flow-registration.sh
                  scripts/test-resolve-nightly-apk.sh

            - name: Resolve latest published Auth build
              id: nightly
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/resolve-nightly-apk.sh --app auth --github-output "$GITHUB_OUTPUT"

    auth-online:
        name: ${{ matrix.lane }}
        needs: resolve
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                lane: ${{ fromJSON(needs.resolve.outputs.lanes) }}
        env:
            AUTH_FIXTURE_COMPOSE_PROJECT: auth-online-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
            FIXTURE_MUTATION_TAG: FixturePersisted
            MISSING_EMAIL: missing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}@example.org
            ONLINE_CODE_ACCOUNT: first-key-${{ github.run_id }}-${{ github.run_attempt }}@example.org
            ONLINE_EMAIL: auth-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}@example.org
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Download resolved Auth build
              env:
                  APK_ASSET_ID: ${{ needs.resolve.outputs.apk_asset_id }}
                  APK_CREATED_AT: ${{ needs.resolve.outputs.apk_created_at }}
                  APK_NAME: ${{ needs.resolve.outputs.apk_name }}
                  APK_SHA256: ${{ needs.resolve.outputs.apk_sha256 }}
                  AUTH_CHANNEL: ${{ needs.resolve.outputs.channel }}
                  AUTH_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
                  GH_TOKEN: ${{ github.token }}
                  SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
              run: |
                  mkdir -p "$AUTH_APK_DIR"
                  apk_path="$AUTH_APK_DIR/$APK_NAME"
                  for attempt in 1 2 3; do
                      if gh api \
                          -H 'Accept: application/octet-stream' \
                          "repos/$SOURCE_REPOSITORY/releases/assets/$APK_ASSET_ID" > "$apk_path"; then
                          break
                      fi
                      if [[ "$attempt" -eq 3 ]]; then
                          echo "Failed to download the resolved Auth APK" >&2
                          exit 1
                      fi
                      sleep $((attempt * 2))
                  done

                  expected_sha256="${APK_SHA256#sha256:}"
                  actual_sha256=$(sha256sum "$apk_path" | awk '{print $1}')
                  if [[ "$actual_sha256" != "$expected_sha256" ]]; then
                      echo "Downloaded Auth APK does not match the resolved release asset" >&2
                      exit 1
                  fi

                  echo "AUTH_APK_PATH=$apk_path" >> "$GITHUB_ENV"
                  echo "AUTH_APK_ASSET_ID=$APK_ASSET_ID" >> "$GITHUB_ENV"
                  echo "AUTH_APK_CREATED_AT=$APK_CREATED_AT" >> "$GITHUB_ENV"
                  echo "AUTH_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
                  echo "AUTH_CHANNEL=$AUTH_CHANNEL" >> "$GITHUB_ENV"
                  echo "AUTH_RELEASE_TAG=$AUTH_RELEASE_TAG" >> "$GITHUB_ENV"
                  echo "AUTH_APK_SHA256=$expected_sha256" >> "$GITHUB_ENV"

            - name: Install pinned Maestro
              run: |
                  curl --fail --location --silent --show-error \
                      --retry 3 --retry-all-errors --retry-delay 2 \
                      "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" \
                      --output "$RUNNER_TEMP/maestro.zip"
                  echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check -
                  mkdir -p "$HOME/.maestro"
                  unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro"
                  maestro_bin="$HOME/.maestro/maestro/bin/maestro"
                  installed_version=$("$maestro_bin" --version)
                  if [[ "$installed_version" != "$MAESTRO_VERSION" ]]; then
                      echo "Expected Maestro $MAESTRO_VERSION, installed $installed_version" >&2
                      exit 1
                  fi
                  echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

            - name: Start local Auth backend
              run: ALLOW_AUTH_FIXTURE_RESTORE=1 scripts/fixtures/restore-auth-fixture.sh

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Prepare private test password
              run: |
                  password="AuthCi-$(openssl rand -hex 10)!"
                  echo "::add-mask::$password"
                  echo "ONLINE_PASSWORD=$password" >> "$GITHUB_ENV"

            - name: Capture runner memory baseline
              run: |
                  mkdir -p artifacts/maestro/runtime-health
                  cgroup_path=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)
                  cgroup_dir="/sys/fs/cgroup$cgroup_path"
                  {
                      date --iso-8601=seconds
                      echo "cgroup=$cgroup_path"
                      for metric in memory.current memory.peak memory.max memory.swap.current memory.swap.max memory.events memory.events.local; do
                          if [[ -r "$cgroup_dir/$metric" ]]; then
                              echo "[$metric]"
                              cat "$cgroup_dir/$metric"
                          fi
                      done
                  } > artifacts/maestro/runtime-health/memory-before.txt

            - name: Run ${{ matrix.lane }} session
              if: matrix.lane != 'recovery-password'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 4
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh "${{ matrix.lane }}"

            - name: Run recovery reset session
              if: matrix.lane == 'recovery-password'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 4
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh recovery-reset

            - name: Run recovery verification session
              if: matrix.lane == 'recovery-password'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 4
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh recovery-verification

            - name: Summarize ${{ matrix.lane }} tests
              if: always()
              env:
                  TEST_OUTCOME: ${{ job.status }}
              run: |
                  if [[ "$TEST_OUTCOME" == "success" ]]; then
                      status="passed"
                      coverage_label="Verified coverage"
                  else
                      status="failed"
                      coverage_label="Planned coverage"
                  fi
                  {
                      echo "### Auth Android ${{ matrix.lane }} $status"
                      echo
                      echo "- Release: \`$AUTH_RELEASE_TAG\`"
                      echo "- Channel: \`$AUTH_CHANNEL\`"
                      echo "- Build: \`$AUTH_APK_NAME\`"
                      echo "- Asset created: \`$AUTH_APK_CREATED_AT\`"
                      echo "- Asset ID: \`$AUTH_APK_ASSET_ID\`"
                      echo "- Auth APK SHA-256: \`$AUTH_APK_SHA256\`"
                      echo "- Android runtime: API \`$AUTH_ANDROID_API\`, target \`$AUTH_ANDROID_TARGET\`"
                      echo "- Maestro: \`$MAESTRO_VERSION\`"
                      echo "- Backend: checked-in public Museum fixture v2"
                      case "${{ matrix.lane }}" in
                          account-auth|data-sync) sessions=1 ;;
                          recovery-password) sessions=2 ;;
                          entity-lifecycle) sessions=1 ;;
                      esac
                      echo "- Fresh emulator sessions: \`$sessions\`"
                      echo
                      echo "#### $coverage_label"
                      echo
                      case "${{ matrix.lane }}" in
                          account-auth)
                              echo "- Live TOTP challenge, synchronized-code visibility, unknown-account error, signup, first Auth-key creation, and cold password login"
                              ;;
                          recovery-password)
                              echo "- Recovery-key password reset, old-password rejection, replacement-password login, and synchronized-code preservation"
                              ;;
                          data-sync)
                              echo "- Prepared password login, active and trashed synchronized codes, account/security settings, and a persisted two-code bulk tag across a cold login"
                              ;;
                          entity-lifecycle)
                              echo "- Synchronized import, edit, tag, pin, trash, cold-start reload, note verification, restore, and permanent deletion"
                              ;;
                      esac
                      echo
                      echo "JUnit results are attached as \`auth-online-${{ matrix.lane }}-results\`."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload ${{ matrix.lane }} results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-results
                  path: artifacts/maestro/online-results
                  if-no-files-found: warn
                  retention-days: 7

            - name: Upload public-fixture failure diagnostics
              if: failure() && matrix.lane != 'account-auth'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-diagnostics
                  path: artifacts/maestro/online-debug
                  if-no-files-found: warn
                  retention-days: 3

            - name: Capture account runtime health
              if: failure()
              run: |
                  mkdir -p artifacts/maestro/runtime-health
                  cgroup_path=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)
                  cgroup_dir="/sys/fs/cgroup$cgroup_path"
                  {
                      date --iso-8601=seconds
                      echo "lane=${{ matrix.lane }}"
                      adb devices -l || true
                      printf 'adb_state='
                      adb get-state || true
                      printf 'app_pid='
                      adb shell pidof "$APP_ID" || true
                      printf 'emulator_processes='
                      pgrep -af 'emulator.*-avd' || true
                      free -h || true
                      df -h || true
                      echo "cgroup=$cgroup_path"
                      for metric in memory.current memory.peak memory.max memory.swap.current memory.swap.max memory.events memory.events.local; do
                          if [[ -r "$cgroup_dir/$metric" ]]; then
                              echo "[$metric]"
                              cat "$cgroup_dir/$metric"
                          fi
                      done
                  } > "artifacts/maestro/runtime-health/${{ matrix.lane }}.txt"
                  sudo dmesg --ctime > artifacts/maestro/runtime-health/kernel.log 2>&1 || true
                  sudo coredumpctl --no-pager list > artifacts/maestro/runtime-health/coredumps.txt 2>&1 || true
                  sudo coredumpctl --no-pager info > artifacts/maestro/runtime-health/coredump-info.txt 2>&1 || true

            - name: Upload account runtime health
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-runtime-health
                  path: artifacts/maestro/runtime-health
                  if-no-files-found: error
                  retention-days: 3

            - name: Show backend status on failure
              if: failure()
              run: docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" -f museum/compose.yaml ps

            - name: Stop local Auth backend
              if: always()
              run: docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" -f museum/compose.yaml down --volumes --remove-orphans

    auth-online-gate:
        name: Auth online gate
        if: always()
        needs: [resolve, auth-online]
        runs-on: ubuntu-latest
        steps:
            - name: Verify required online lanes
              env:
                  LANE_RESULT: ${{ needs.auth-online.result }}
                  RESOLVE_RESULT: ${{ needs.resolve.result }}
              run: |
                  test "$RESOLVE_RESULT" = success
                  test "$LANE_RESULT" = success

name: "Auth Android online"

on:
    schedule:
        - cron: "17 1 * * *"
    workflow_dispatch:
        inputs:
            lane:
                description: Online suite to run
                required: true
                default: all
                type: choice
                options:
                    - all
                    - account-auth
                    - recovery-password
                    - data-sync
                    - entity-lifecycle
                    - startup
    pull_request:
        paths:
            - ".github/scripts/run-auth-online-tests.sh"
            - ".github/workflows/auth-android-online.yml"
            - "maestro/auth/online/**"
            - "museum/**"
            - "scripts/current-totp.mjs"
            - "scripts/fixtures/**"
            - "tools/auth-fixture-generator/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/download-auth-apk.sh"
            - "scripts/install-maestro.sh"
            - "scripts/test-ci-helpers.sh"
            - "scripts/select-auth-online-lanes.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-online-lanes.sh"
    push:
        branches: [main]
        paths:
            - ".github/scripts/run-auth-online-tests.sh"
            - ".github/workflows/auth-android-online.yml"
            - "maestro/auth/online/**"
            - "museum/**"
            - "scripts/current-totp.mjs"
            - "scripts/fixtures/**"
            - "tools/auth-fixture-generator/**"
            - "scripts/resolve-nightly-apk.sh"
            - "scripts/download-auth-apk.sh"
            - "scripts/install-maestro.sh"
            - "scripts/test-ci-helpers.sh"
            - "scripts/select-auth-online-lanes.sh"
            - "scripts/test-hosted-flow-registration.sh"
            - "scripts/test-resolve-nightly-apk.sh"
            - "scripts/test-select-auth-online-lanes.sh"

permissions:
    contents: read

concurrency:
    group: auth-android-online-${{ github.ref }}-${{ inputs.lane || 'automatic' }}
    cancel-in-progress: true

env:
    APP_ID: io.ente.auth.independent
    MAESTRO_CLI_NO_ANALYTICS: 1
    # Analytics opt-out does not cover error reports (Maestro issue #3488).
    MAESTRO_API_URL: http://127.0.0.1:9
    AUTH_ANDROID_API: 34
    AUTH_ANDROID_TARGET: default
    AUTH_EMULATOR_BUILD: 15917651
    AUTH_EMULATOR_OPTIONS: -no-window -gpu host -feature -Vulkan -accel on -no-metrics -no-snapshot -noaudio -no-boot-anim -memory 4096
    LIBGL_ALWAYS_SOFTWARE: 1
    ONLINE_ENDPOINT: http://10.0.2.2:8080
    ONLINE_OTT: 123456

jobs:
    resolve:
        name: Resolve test inputs
        runs-on: ubuntu-latest
        outputs:
            apk_asset_id: ${{ steps.nightly.outputs.apk_asset_id }}
            apk_created_at: ${{ steps.nightly.outputs.apk_created_at }}
            apk_name: ${{ steps.nightly.outputs.apk_name }}
            apk_sha256: ${{ steps.nightly.outputs.apk_sha256 }}
            channel: ${{ steps.nightly.outputs.channel }}
            lanes: ${{ steps.lanes.outputs.lanes }}
            release_tag: ${{ steps.nightly.outputs.release_tag }}
            source_repository: ${{ steps.nightly.outputs.source_repository }}
            should_run: ${{ steps.freshness.outputs.should_run }}
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Resolve online lanes
              id: lanes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
                  EVENT_NAME: ${{ github.event_name }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  REQUESTED_LANE: ${{ inputs.lane || 'all' }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                      case "$REQUESTED_LANE" in
                          all) lanes=$(scripts/select-auth-online-lanes.sh --all) ;;
                          account-auth|recovery-password|data-sync|entity-lifecycle|startup) lanes="[\"$REQUESTED_LANE\"]" ;;
                          *) echo "Unknown lane: $REQUESTED_LANE" >&2; exit 2 ;;
                      esac
                  elif [[ "$EVENT_NAME" == "pull_request" ]]; then
                      lanes=$(scripts/select-auth-online-lanes.sh "$BASE_SHA" "$HEAD_SHA")
                  else
                      lanes=$(scripts/select-auth-online-lanes.sh --all)
                  fi
                  if [[ "$(jq length <<< "$lanes")" -eq 0 ]]; then
                      echo "The online workflow ran without selecting an online lane" >&2
                      exit 1
                  fi
                  echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

            - name: Validate hosted test configuration
              run: |
                  scripts/test-select-auth-online-lanes.sh
                  scripts/test-hosted-flow-registration.sh
                  scripts/test-resolve-nightly-apk.sh
                  scripts/test-ci-helpers.sh

            - name: Resolve latest published Auth build
              id: nightly
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/resolve-nightly-apk.sh --github-output "$GITHUB_OUTPUT"

            - name: Check scheduled build freshness
              id: freshness
              env:
                  APK_CREATED_AT: ${{ steps.nightly.outputs.apk_created_at }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  should_run=true
                  if [[ "$EVENT_NAME" == "schedule" ]]; then
                      created_epoch=$(date -u -d "$APK_CREATED_AT" +%s)
                      now_epoch=$(date -u +%s)
                      age_seconds=$((now_epoch - created_epoch))
                      if (( age_seconds < 0 || age_seconds > 86400 )); then
                          should_run=false
                          echo "The latest Auth APK is $age_seconds seconds old; skipping this scheduled run."
                      fi
                  fi
                  echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

            - name: Summarize scheduled skip
              if: steps.freshness.outputs.should_run == 'false'
              run: |
                  {
                      echo "### Auth Android online skipped"
                      echo
                      echo "No compatible Auth APK was published in the previous 24 hours."
                  } >> "$GITHUB_STEP_SUMMARY"

    auth-online:
        name: ${{ matrix.lane }}
        needs: resolve
        if: needs.resolve.outputs.should_run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                lane: ${{ fromJSON(needs.resolve.outputs.lanes) }}
        env:
            AUTH_APK_ASSET_ID: ${{ needs.resolve.outputs.apk_asset_id }}
            AUTH_APK_CREATED_AT: ${{ needs.resolve.outputs.apk_created_at }}
            AUTH_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
            AUTH_APK_NAME: ${{ needs.resolve.outputs.apk_name }}
            AUTH_APK_SHA256: ${{ needs.resolve.outputs.apk_sha256 }}
            AUTH_CHANNEL: ${{ needs.resolve.outputs.channel }}
            AUTH_SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
            AUTH_APK_PATH: ${{ github.workspace }}/artifacts/auth/${{ needs.resolve.outputs.apk_name }}
            AUTH_FIXTURE_COMPOSE_PROJECT: auth-online-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
            MISSING_EMAIL: missing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}@example.org
            ONLINE_CODE_ACCOUNT: first-key-${{ github.run_id }}-${{ github.run_attempt }}@example.org
            ONLINE_EMAIL: auth-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}@example.org
        steps:
            - name: Checkout tests
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Set up Node for live TOTP generation
              if: matrix.lane == 'account-auth'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Download resolved Auth build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/download-auth-apk.sh "$AUTH_SOURCE_REPOSITORY" "$AUTH_APK_ASSET_ID" "$AUTH_APK_SHA256" "$AUTH_APK_PATH"

            - name: Install pinned Maestro
              run: scripts/install-maestro.sh

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm --settle
                  ls -l /dev/kvm
                  test -r /dev/kvm && test -w /dev/kvm

            - name: Restore Auth backend fixture
              env:
                  ALLOW_AUTH_FIXTURE_RESTORE: 1
              run: scripts/fixtures/restore-auth-fixture.sh

            - name: Start virtual display for Mesa
              timeout-minutes: 1
              run: |
                  read -r display < <(Xvfb -displayfd 1 -screen 0 1280x1024x24 -nolisten tcp 2> /tmp/auth-xvfb.log)
                  echo "DISPLAY=:$display" >> "$GITHUB_ENV"

            - name: Prepare private test password
              run: |
                  password="AuthCi-$(openssl rand -hex 10)!"
                  echo "::add-mask::$password"
                  echo "ONLINE_PASSWORD=$password" >> "$GITHUB_ENV"

            - name: Run ${{ matrix.lane }} session
              if: matrix.lane == 'account-auth' || matrix.lane == 'data-sync' || matrix.lane == 'startup'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh "${{ matrix.lane }}"

            - name: Run recovery reset session
              if: matrix.lane == 'recovery-password'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh recovery-reset

            - name: Run recovery verification session
              if: matrix.lane == 'recovery-password'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh recovery-verification

            - name: Run lifecycle create session
              if: matrix.lane == 'entity-lifecycle'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh entity-lifecycle-create

            - name: Run lifecycle mutation session
              if: matrix.lane == 'entity-lifecycle'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh entity-lifecycle-mutate

            - name: Run lifecycle restore and delete session
              if: matrix.lane == 'entity-lifecycle'
              uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: ${{ env.AUTH_ANDROID_API }}
                  emulator-build: ${{ env.AUTH_EMULATOR_BUILD }}
                  target: ${{ env.AUTH_ANDROID_TARGET }}
                  arch: x86_64
                  profile: pixel_5
                  cores: 2
                  emulator-options: ${{ env.AUTH_EMULATOR_OPTIONS }}
                  disable-animations: true
                  script: .github/scripts/run-auth-online-tests.sh entity-lifecycle-finish

            # This phase stops at the empty email screen; no credentials are entered.
            - name: Upload startup diagnostics
              if: always() && matrix.lane == 'startup'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-startup-diagnostics
                  path: artifacts/maestro/online-debug/startup
                  retention-days: 3

            # These lanes use only checked-in public credentials, unlike signup.
            - name: Upload public TOTP fixture failure diagnostics
              if: failure() && matrix.lane == 'account-auth'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-totp-diagnostics
                  path: |
                      artifacts/maestro/online-debug/account-auth/prepared-totp-start
                      artifacts/maestro/online-debug/account-auth/prepared-totp-complete
                  retention-days: 3

            - name: Upload public-fixture failure diagnostics
              if: failure() && matrix.lane != 'account-auth' && matrix.lane != 'startup'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-diagnostics
                  path: artifacts/maestro/online-debug
                  retention-days: 3

            - name: Upload ${{ matrix.lane }} results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-results
                  path: artifacts/maestro/online-results/**/*.xml
                  if-no-files-found: error
                  retention-days: 7

            - name: Summarize ${{ matrix.lane }} tests
              if: always()
              env:
                  TEST_OUTCOME: ${{ job.status }}
              run: |
                  if [[ "$TEST_OUTCOME" == "success" ]]; then
                      status="passed"
                      coverage_label="Verified coverage"
                  else
                      status="failed"
                      coverage_label="Planned coverage"
                  fi
                  {
                      echo "### Auth Android ${{ matrix.lane }} $status"
                      echo
                      echo "- Release: \`$AUTH_RELEASE_TAG\`"
                      echo "- Channel: \`$AUTH_CHANNEL\`"
                      echo "- Build: \`$AUTH_APK_NAME\`"
                      echo "- Asset created: \`$AUTH_APK_CREATED_AT\`"
                      echo "- Asset ID: \`$AUTH_APK_ASSET_ID\`"
                      echo "- Auth APK SHA-256: \`$AUTH_APK_SHA256\`"
                      echo "- Android runtime: API \`$AUTH_ANDROID_API\`, target \`$AUTH_ANDROID_TARGET\`"
                      echo "- Emulator build: \`$AUTH_EMULATOR_BUILD\` (KVM, SwiftShader graphics)"
                      echo "- Maestro: \`$MAESTRO_VERSION\`"
                      echo "- Backend: checked-in public Museum fixture v2"
                      case "${{ matrix.lane }}" in
                          account-auth|data-sync|startup) sessions=1 ;;
                          recovery-password) sessions=2 ;;
                          entity-lifecycle) sessions=3 ;;
                      esac
                      echo "- Fresh emulator sessions: \`$sessions\`"
                      echo
                      echo "#### $coverage_label"
                      echo
                      case "${{ matrix.lane }}" in
                          startup)
                              echo "- Clean startup with fixture preferences, bounded welcome-screen readiness, and navigation to the empty login email screen (no authentication)"
                              ;;
                          account-auth)
                              echo "- Live TOTP challenge, synchronized-code visibility, unknown-account error, signup, first Auth-key creation, and cold password login"
                              ;;
                          recovery-password)
                              echo "- Recovery-key password reset, old-password rejection, replacement-password login, and synchronized-code preservation"
                              ;;
                          data-sync)
                              echo "- Prepared password login, active and trashed synchronized codes, account/security settings, and a persisted two-code bulk tag across a cold login"
                              ;;
                          entity-lifecycle)
                              echo "- Synchronized import, edit, tag, pin, trash, cold-start reload, note verification, restore, and permanent deletion"
                              ;;
                      esac
                      echo
                      echo "JUnit artifact: \`auth-online-${{ matrix.lane }}-results\`. See the upload step for availability."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Capture host runtime health
              if: failure()
              run: |
                  mkdir -p artifacts/maestro/runtime-health
                  {
                      date -u '+%Y-%m-%dT%H:%M:%SZ'
                      echo "lane=${{ matrix.lane }}"
                      uname -a
                      lscpu
                      free -h
                      df -h || true
                  } > "artifacts/maestro/runtime-health/${{ matrix.lane }}-host.txt"
                  sudo dmesg --ctime > "artifacts/maestro/runtime-health/${{ matrix.lane }}-kernel.txt"
                  sudo journalctl -b --no-pager -u systemd-oomd > artifacts/maestro/runtime-health/oomd.txt
                  if [[ '${{ matrix.lane }}' != account-auth ]]; then
                      find /tmp/android-runner -maxdepth 1 -name 'emu-crash-*.db' -exec cp -R {} artifacts/maestro/runtime-health/ \; || true
                  fi
                  docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" --file museum/compose.yaml logs --no-color > artifacts/maestro/runtime-health/backend.log 2>&1 || true

            - name: Upload account runtime health
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: auth-online-${{ matrix.lane }}-runtime-health
                  path: artifacts/maestro/runtime-health
                  if-no-files-found: error
                  retention-days: 3

            - name: Show backend status on failure
              if: failure()
              run: |
                  docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" --file museum/compose.yaml ps
                  docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" --file museum/compose.yaml logs --no-color --tail=100

            - name: Stop Auth backend
              if: always()
              run: docker compose --project-name "$AUTH_FIXTURE_COMPOSE_PROJECT" --file museum/compose.yaml down --volumes --remove-orphans

    auth-online-gate:
        name: Auth online gate
        if: always()
        needs: [resolve, auth-online]
        runs-on: ubuntu-latest
        steps:
            - name: Verify required online lanes
              env:
                  LANE_RESULT: ${{ needs.auth-online.result }}
                  RESOLVE_RESULT: ${{ needs.resolve.result }}
                  SHOULD_RUN: ${{ needs.resolve.outputs.should_run }}
              run: |
                  test "$RESOLVE_RESULT" = success
                  if [[ "$SHOULD_RUN" != "true" ]]; then
                      echo "Scheduled run skipped because no compatible Auth APK was published in the previous 24 hours."
                      exit 0
                  fi
                  test "$LANE_RESULT" = success
